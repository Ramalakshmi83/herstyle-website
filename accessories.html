        /* Container for all products */
.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px;
    background: rgb(243, 238, 222); /* light background similar to wishlist */
}

/* Each product card */
.product-card {
    background: #fff;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* Hover effect */
.product-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}

/* Product image */
.product-card img {
    width: 50%;           /* adjust size as per design */
    height: 200px;        /* fixed height */
    object-fit: cover;    /* maintain aspect ratio, no stretch */
    border-radius: 10px;
    margin-bottom: 10px;
}

/* Product title */
.product-card h3 {
    font-size: 18px;
    margin: 10px 0 5px;
    color: #333;
}

/* Product price */
.product-card p {
    font-size: 16px;
    color: #555;
    font-weight: bold;
}
.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap: 20px;
    padding: 20px;
}
.card {
    background: white;
    padding: 10px;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
}
.card:hover {
    transform: translateY(-8px) scale(1.03);
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
}
.image-box {
    position: relative;
}

.image-box img {
    width: 100%;
    border-radius: 10px;
}
.wishlist-icon {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 22px;
    color: rgb(247, 37, 128);
    cursor: pointer;
    width: 50px;
}

.wishlist-icon.active {
    color: rgb(247, 37, 128);
}
.cart-btn {
    background: black;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 15px;
    cursor: pointer;
}
    </style>
